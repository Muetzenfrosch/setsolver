# Nginx-Konfiguration für den Set-Finder (statische Blazor-WebAssembly-App).
# Inhalt von "publish/wwwroot" nach /var/www/set-finder kopieren, Domain anpassen,
# Datei z. B. nach /etc/nginx/sites-available/ legen und verlinken. HTTPS (z. B. per certbot)
# wird empfohlen: Erst damit funktionieren Offline-Modus und "Zum Startbildschirm hinzufügen".

server {
    listen 80;
    listen [::]:80;
    server_name set.example.de;

    root /var/www/set-finder;
    index index.html;

    # WebAssembly braucht den korrekten MIME-Typ, sonst lehnen Browser die Module ab.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;  # fehlt in älteren mime.types; Warnung "duplicate extension" ist harmlos
        application/manifest+json webmanifest;
    }

    # Vorkomprimierte .gz-Dateien aus dem Publish direkt ausliefern.
    # Mit dem Modul ngx_brotli zusätzlich "brotli_static on;" aktivieren.
    gzip_static on;

    # Dateinamen in _framework enthalten einen Hash und ändern sich bei jedem Update.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Diese Dateien steuern Updates und dürfen nicht lange im Cache liegen.
    location ~ ^/(index\.html|service-worker\.js|service-worker-assets\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
