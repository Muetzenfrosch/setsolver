# Nginx im Docker-Image: liefert die Set-Finder-App aus /usr/share/nginx/html aus.
# Ersetzt /etc/nginx/conf.d/default.conf des offiziellen Nginx-Images (MIME-Typen inkl. wasm kommen von dort).

server {
    # Nur IPv4: Auf Docker-Hosts ohne IPv6 würde "listen [::]:80" den Start verhindern. Docker leitet
    # den Port trotzdem auch über IPv6 weiter, wenn der Host das kann.
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Vorkomprimierte .gz-Dateien aus dem Publish direkt ausliefern.
    gzip_static on;

    # Dateinamen in _framework enthalten einen Hash und ändern sich bei jedem Update.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Diese Dateien steuern Updates und dürfen nicht lange im Cache liegen.
    location ~ ^/(index\.html|service-worker\.js|service-worker-assets\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
